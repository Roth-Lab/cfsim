[project]
name = "cfsim"
requires-python = ">=3.12"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "click>=8.0",
    "h5py",
    "pandas",
    "pysam",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "numpy",
]
scripts = { cfsim = "cfsim.cli:main"}

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]